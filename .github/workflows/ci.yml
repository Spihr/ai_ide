name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（协议 + 内核）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        # 注：ts-rs 会输出若干 "failed to parse serde attribute" 的宏诊断，
        # 它们不参与 -D warnings 的升级，因此这里可以安全地要求零告警。
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试
        # 内核 stderr 默认被测试脚手架丢弃，偶发失败时（如 5002「会话库未就绪」）
        # 日志里只剩一句笼统的断言失败，根本看不出真实错误。这里显式指定落盘目录，
        # 失败时由下一步上传——目录必须先建好，脚手架检测到是目录才会按进程分文件。
        run: |
          New-Item -ItemType Directory -Force -Path "$env:AI_IDE_TEST_CORE_LOG" | Out-Null
          cargo test --workspace
        env:
          AI_IDE_TEST_CORE_LOG: ${{ runner.temp }}\core-logs

      - name: 上传内核日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-logs
          path: ${{ runner.temp }}/core-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: 构建内核
        run: cargo build -p ai-ide-core

      # 直接对内核二进制做协议冒烟：握手、ping 往返、错误路径、优雅退出。
      - name: 协议冒烟
        run: node scripts/smoke-core.mjs

      # 「日志不含 API Key」是 docs/05 的 M5 硬指标。这里不只扫固定样本：
      # 先自检检测器，再让内核以 AI_IDE_LOG_PROBE=1 写一批含假密钥的真实日志，
      # 然后扫它自己写的日志。扫不到任何日志行也算失败，避免空目录蒙混过关。
      # 直接跑脚本（只用 Node 内置模块，不依赖 pnpm 安装）；本机等价入口是
      # `pnpm scan:secrets`，它执行的就是同一条命令。
      - name: 日志密钥扫描
        run: node scripts/scan-log-secrets.mjs --probe

  desktop:
    name: Desktop（类型 + 检查 + 测试）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 必须显式给 version：pnpm/action-setup@v4 在既没有 version 输入、
      # 根 package.json 也没有 packageManager 字段时会直接硬失败
      # （Error: No pnpm version is specified）。这里锁定与本机一致的版本，
      # 保证 --frozen-lockfile 与 pnpm-workspace.yaml 的 allowBuilds 语义一致。
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 重新生成协议类型
        run: pnpm types:gen

      # generated/ 是构建产物但入库，因此必须保证「重新生成后无差异」，
      # 否则说明有人手改了生成文件、或忘了把 Rust 侧的改动同步过来。
      - name: 校验协议类型无漂移
        run: git diff --exit-code -- packages/shared-types/src/generated

      - name: 代码检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建外壳
        run: pnpm --filter @ai-ide/desktop build
