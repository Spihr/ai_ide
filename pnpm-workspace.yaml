packages:
  - "apps/*"
  - "packages/*"

# 依赖的安装脚本默认被 pnpm 拦截，这里显式放行需要的两个：
#   - esbuild：落位平台原生可执行文件（vite / electron-vite 依赖）
#   - electron：postinstall 下载 Chromium 二进制
allowBuilds:
  esbuild: true
  electron: true
  # electron-winstaller 的 install 脚本只挑选对应架构的 7za 二进制（Squirrel 打包用），
  # 明确放行以免 pnpm v12 的 strictDepBuilds 在安装阶段直接报 ERR_PNPM_IGNORED_BUILDS。
  electron-winstaller: true
