[package]
name = "ai-ide-core"
description = "AI IDE 内核：索引 / 解析 / LLM / Agent（M0 阶段仅实现通信骨架）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ai-ide-core"
path = "src/main.rs"

[dependencies]
ai-ide-protocol = { workspace = true }
ai-ide-workspace = { workspace = true }
ai-ide-indexer = { workspace = true }
ai-ide-llm = { workspace = true }
# M4 第四切片：内核接线 agent crate（协议面 `agent.*` 在上一切片已定，这里把它跑起来）。
ai-ide-agent = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
# `ModelTurn` / `Decider` 都是 async trait：用 async-trait 实现，与 crates/agent 同口径。
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
