[package]
name = "ai-ide-core"
description = "AI IDE 内核：索引 / 解析 / LLM / Agent（M0 阶段仅实现通信骨架）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ai-ide-core"
path = "src/main.rs"

[dependencies]
ai-ide-protocol = { workspace = true }
ai-ide-workspace = { workspace = true }
ai-ide-indexer = { workspace = true }
ai-ide-llm = { workspace = true }
# M4 第四切片：内核接线 agent crate（协议面 `agent.*` 在上一切片已定，这里把它跑起来）。
ai-ide-agent = { workspace = true }
# M5 切片二：内核接线会话持久化（协议面 `session.*` 与 store 同切片落地）。
ai-ide-store = { workspace = true }
# M6 切片一：内核接线终端（PTY 在 crates/terminal，core 只做协议翻译与事件转发）。
ai-ide-terminal = { workspace = true }
# M6 切片三：内核接线 Git（子进程在 crates/git，core 只做协议翻译与阻塞搬运）。
ai-ide-git = { workspace = true }
# M7 切片二：内核接线 MCP（连接管理器、`mcp.*` 处理、工具注入 agent 注册表）。
ai-ide-mcp = { workspace = true }
# M8 切片一：插件系统 P1（清单校验 + 安装落盘 + 账本），不含进程管理。
ai-ide-plugin = { workspace = true }
# `terminal.write` / `terminal.data` 的载荷是原始字节的 base64，core 侧负责编解码。
base64 = { workspace = true }
# P5 切片五：`host/net.fetch` 的出站传输。用 workspace 里已钉好的 reqwest（rustls +
# webpki 根），不给 core 单独换一套 TLS 栈。
reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
# `ModelTurn` / `Decider` 都是 async trait：用 async-trait 实现，与 crates/agent 同口径。
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# 终端端到端测试要断言 `terminal.data` 里的输出内容，得把 base64 解回来
base64 = { workspace = true }
