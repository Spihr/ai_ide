[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/workspace",
    "crates/indexer",
    "crates/llm",
    "crates/agent",
    "crates/store",
    "crates/terminal",
    "crates/git",
    "crates/mcp",
    # M8 / 插件系统 P1：清单校验、安装目录与包复制（内核侧，不启动插件进程）。
    "crates/plugin",
    # LSP 客户端基础层：分帧 stdio 传输、请求关联、通知广播、生命周期、文档同步。
    "crates/lsp",
    # 语法解析层（tree-sitter）：增量解析与符号表，`search.symbols` 的精确来源。
    "crates/parser",
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
repository = "https://example.invalid/ai-ide"

[workspace.dependencies]
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "2.0"
anyhow = "1.0"

# 异步运行时
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "time",
    "signal",
    # M7 切片一：stdio 传输要起 MCP Server 子进程（process），HTTP 传输要连本地/远端
    # （net 由 reqwest 提供，测试里的内置 HTTP 桩用 tokio::net 起监听）。
    "process",
    "net",
] }
tokio-util = { version = "0.7", features = ["rt"] }

# 模型接入（M2）：HTTP 客户端走 reqwest + rustls（见 docs/02 §9、docs/04 §1）
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"

# 可观测性
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 工具
uuid = { version = "1.10", features = ["v4", "serde"] }

# 精确分词（M3）：按模型族选编码（o200k_base / cl100k_base），词表随二进制内嵌
tiktoken-rs = "0.11"

# 文件系统与检索
ignore = "0.4"
globset = "0.4"
regex = "1.11"
notify = "6.1"
encoding_rs = "0.8"
sha2 = "0.10"
trash = "3.3"

# 持久化（M5 切片一）：只开 SQLite 驱动 + 迁移宏；libsqlite3 随二进制内嵌编译，
# 不依赖用户机器上的 sqlite3.dll。查询走运行时校验接口，编译期不需要 DATABASE_URL。
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }

# 终端（M6 切片一）：跨平台伪终端抽象，Windows 下走 ConPTY（Win10 1809+），
# Unix 下走 openpty。自己直连 ConPTY 的代价是要重写一整套句柄 / 线程亲和逻辑，
# 收益仅是少一个依赖——不值得。
portable-pty = "0.9"

# 协议与事件的字节载荷（终端输出可能不是合法 UTF-8）
base64 = "0.22"

# Windows 专用（M4 切片二）：Job Object 保证超时后整棵进程树被回收
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# 语法解析（tree-sitter）：符号表要的是「真实语法树」，不是正则猜出来的行首声明。
# 语法库是 C 代码，随 crate 一起编译，因此不依赖用户机器上的工具链之外的东西。
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"

# 内部 crate
ai-ide-protocol = { path = "crates/protocol" }
ai-ide-parser = { path = "crates/parser" }
ai-ide-workspace = { path = "crates/workspace" }
ai-ide-indexer = { path = "crates/indexer" }
ai-ide-llm = { path = "crates/llm" }
ai-ide-agent = { path = "crates/agent" }
ai-ide-store = { path = "crates/store" }
ai-ide-terminal = { path = "crates/terminal" }
ai-ide-git = { path = "crates/git" }
# M7 切片一：MCP 客户端（stdio / HTTP(SSE) 传输、握手、工具发现与调用）
ai-ide-mcp = { path = "crates/mcp" }
# 插件系统 P1：清单三段校验 + 安装目录/包复制（纯内核逻辑，spawn 留给 P2）
ai-ide-plugin = { path = "crates/plugin" }
# LSP 客户端基础层：Content-Length 分帧 stdio 传输、请求关联、通知广播、文档同步
ai-ide-lsp = { path = "crates/lsp" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# 内核开发期需要可用的 panic 信息，不做 abort
panic = "unwind"
